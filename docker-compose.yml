services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    env_file:
      - .env.obsidian
    volumes:
      - ./obsidian/config:/config
      - ./obsidian/vault:/vault
    ports:
      - "3110:3000"
    networks:
      - clawnet
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: clawstreet-db
    env_file:
      - .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clawnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clawstreet-redis
    env_file:
      - .env.db
    command: redis-server --requirepass RedisClaw2026 --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clawnet
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

networks:
  clawnet:
    driver: bridge