# ClawStreetBot v2 — Infrastructure
# All config flows through .env (gitignored) — never hardcode credentials here.

services:
  # ── Data Layer ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cbs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clawstreetbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache & Pub/Sub ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cbs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Workflow Engine ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cbs-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?Set N8N_PASSWORD in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-clawstreetbot}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-cbs}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: ${TZ:-America/Los_Angeles}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ── Knowledge Base ───────────────────────────────────────────
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: cbs-obsidian
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      TZ: ${TZ:-America/Los_Angeles}
      CUSTOM_USER: ${OBSIDIAN_USER:-cbs}
      PASSWORD: ${OBSIDIAN_PASSWORD:?Set OBSIDIAN_PASSWORD in .env}
    ports:
      - "${OBSIDIAN_HTTP_PORT:-3000}:3000"
      - "${OBSIDIAN_HTTPS_PORT:-3001}:3001"
    volumes:
      - obsidian_config:/config
      - ./docs/obsidian:/config/obsidian/vaults/ClawStreetBot
    shm_size: "1gb"
    security_opt:
      - seccomp=unconfined  # required for electron apps in Docker

  # ── Layer Containers ─────────────────────────────────────────
  # Each layer is built from the same Dockerfile template with
  # its own requirements.txt. Add layers as they're built.

  # 01_data:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.layer
  #     args:
  #       LAYER: 01_data
  #   container_name: cbs-01-data
  #   restart: unless-stopped
  #   env_file: .env
  #   volumes:
  #     - ./config:/app/config:ro
  #     - ./shared:/app/shared:ro
  #     - ./01_data:/app/layer
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  obsidian_config: