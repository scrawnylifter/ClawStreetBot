services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    env_file:
      - .env.obsidian
    volumes:
      - ./obsidian/config:/config
      - ./obsidian/vault:/vault
    ports:
      - "3110:3000"
    networks:
      - clawnet
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: clawstreet-db
    env_file:
      - .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clawnet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clawstreet-redis
    env_file:
      - .env.db
    command: redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clawnet
    restart: unless-stopped

  # Idle Python container that n8n execs ingestion/compute scripts into.
  # Project tree is bind-mounted at /app so edits land without rebuilding.
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    image: clawstreetbot/worker:latest
    container_name: clawstreet-worker
    env_file:
      - .env.db
      - .env.polygon
      - .env.alpaca
    environment:
      - POSTGRES_HOST=postgres
      - PYTHONPATH=/app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./db/init:/app/db/init:ro
      - ./.env.db:/app/.env.db:ro
      - ./.env.polygon:/app/.env.polygon:ro
      - ./.env.alpaca:/app/.env.alpaca:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clawnet
    restart: unless-stopped

  # Per-endpoint allowlisting socket proxy. Unlike tecnativa's section-level
  # flags (which let CONTAINERS=1 also enable stop/kill/delete of arbitrary
  # containers), wollomatic/socket-proxy matches each HTTP method against a
  # single regex. We only allow:
  #   - GET  /_ping, /version                           (docker CLI handshake)
  #   - GET  /containers/clawstreet-worker/json         (inspect by name)
  #   - POST /containers/clawstreet-worker/exec         (create exec)
  #   - POST /exec/{hex-id}/(start|resize)              (run exec)
  # `-allowfrom` restricts the source to the n8n container by name. Every
  # other endpoint (create, delete, stop, kill, restart, images, volumes,
  # build, swarm, network, system, etc.) is denied.
  docker-proxy:
    image: wollomatic/socket-proxy:1
    container_name: clawstreet-docker-proxy
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -socketpath=/var/run/docker.sock
      - -allowfrom=clawstreet-n8n
      # $$ is the docker-compose escape for a literal $ (regex end-anchor).
      # Docker CLI sends HEAD /_ping during handshake; n8n's client also GETs exec/{id}/json
      # to inspect results. Both must be allowed for `docker exec` to work end-to-end.
      - -allowGET=^/(v[\d.]+/)?(_ping|version|containers/clawstreet-worker/json|exec/[a-f0-9]+/json)$$
      - -allowHEAD=^/(v[\d.]+/)?(_ping|version)$$
      - -allowPOST=^/(v[\d.]+/)?(containers/clawstreet-worker/exec|exec/[a-f0-9]+/(start|resize))$$
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65534:${DOCKER_GID:-988}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - clawnet
    restart: unless-stopped

  # n8n reaches the Docker engine ONLY through docker-proxy. No direct
  # /var/run/docker.sock mount, so n8n cannot spawn new containers, mount
  # host paths, pull images, etc. — only `exec` into existing ones the
  # proxy whitelists.
  n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
    image: clawstreetbot/n8n:latest
    container_name: clawstreet-n8n
    env_file:
      - .env.n8n
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      # Re-enable Execute Command and Local File Trigger nodes (disabled by default in n8n v2.x).
      # Setting NODES_EXCLUDE to an empty array overrides the breaking-change rule.
      - NODES_EXCLUDE=[]
      # Routes the docker CLI inside this container through the proxy.
      - DOCKER_HOST=tcp://docker-proxy:2375
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - worker
      - docker-proxy
    networks:
      - clawnet
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  n8n_data:

networks:
  clawnet:
    driver: bridge
