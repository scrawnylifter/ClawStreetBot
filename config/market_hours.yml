# ClawStreetBot market hours — single source of truth.
# All scripts and n8n workflows should read from here (via scripts/constants.py).
# Times in US/Eastern (ET).

exchange: NYSE
timezone: America/New_York

regular_session:
  open: "09:30"
  close: "16:00"

pre_market:
  open: "04:00"

after_hours:
  close: "20:00"

# Ingestion windows (PDT/ET equivalent cron-friendly ranges)
# These are the times our data pipeline runs, with buffer before/after session.
ingestion:
  intraday_start: "06:00"   # ET 09:00 — 30 min pre-market buffer
  intraday_end: "16:30"     # ET 19:30 — 30 min post-close buffer
  daily_after_close: "16:30" # ET 19:30 — daily bars after settlement

# Scanner windows (when detectors should actually fire)
scanner:
  orb_start: "09:45"       # ET — first bar after opening range completes
  intraday_end: "16:00"    # ET — stop scanning at close

# Holidays observed (NYSE closed) — update annually
# 2026 major holidays (NYSE rule: when holiday falls on Saturday, Fri off; Sunday, Mon off)
holidays_2026:
  - "2026-01-01"  # New Year's Day
  - "2026-01-19"  # MLK Day
  - "2026-02-16"  # Presidents' Day
  - "2026-04-03"  # Good Friday
  - "2026-05-25"  # Memorial Day
  - "2026-07-03"  # Independence Day (observed)
  - "2026-09-07"  # Labor Day
  - "2026-11-26"  # Thanksgiving
  - "2026-12-25"  # Christmas